[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "comfymcp"
version = "0.1.0"
description = "MCP server for ComfyUI - programmatic workflow building and execution"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "ComfyMCP Contributors" }
]
keywords = ["mcp", "comfyui", "ai", "image-generation", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=1.0.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
comfymcp = "comfymcp.server:main"

[project.urls]
Homepage = "https://github.com/comfymcp/comfymcp"
Repository = "https://github.com/comfymcp/comfymcp"

[tool.hatch.build.targets.wheel]
packages = ["src/comfymcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
